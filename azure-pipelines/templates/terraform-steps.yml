# ============================================================
# Reusable Terraform steps template.
# Params:
#   environment: dev | staging | prod
#   applyChanges: if false, only runs plan (used for PR validation)
# ============================================================
parameters:
  - name: environment
    type: string
  - name: applyChanges
    type: boolean
    default: true

steps:
  - task: TerraformInstaller@1
    inputs:
      terraformVersion: "1.9.8"
    displayName: "Install Terraform"

  - script: |
      echo "$(SNOWFLAKE_PRIVATE_KEY)" > $(Pipeline.Workspace)/sf_private_key.pem
      chmod 600 $(Pipeline.Workspace)/sf_private_key.pem
      echo "##vso[task.setvariable variable=TF_VAR_user_private_key]$(Pipeline.Workspace)/sf_private_key.pem"
    displayName: "Materialize Snowflake private key"
    env:
      SNOWFLAKE_PRIVATE_KEY: $(SNOWFLAKE_PRIVATE_KEY)

  - script: |
      terraform init -backend-config="environments/backend-${{ parameters.environment }}.conf"
    workingDirectory: terraform
    displayName: "terraform init"
    env:
      ARM_CLIENT_ID: $(ARM_CLIENT_ID)
      ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
      ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
      ARM_TENANT_ID: $(ARM_TENANT_ID)

  - script: |
      terraform plan -var-file="environments/${{ parameters.environment }}.tfvars" -out=tfplan
    workingDirectory: terraform
    displayName: "terraform plan"
    env:
      TF_VAR_snowflake_org: $(SNOWFLAKE_ORG)
      TF_VAR_snowflake_account: $(SNOWFLAKE_ACCOUNT)
      TF_VAR_snowflake_user: $(SNOWFLAKE_USER)
      TF_VAR_private_key_passphrase: $(SNOWFLAKE_PRIVATE_KEY_PASSPHRASE)
      TF_VAR_warehouse: $(SNOWFLAKE_WAREHOUSE)
      TF_VAR_role: $(SNOWFLAKE_ROLE)
      TF_VAR_environment: ${{ parameters.environment }}

  - ${{ if eq(parameters.applyChanges, true) }}:
      - script: terraform apply -auto-approve tfplan
        workingDirectory: terraform
        displayName: "terraform apply"
        env:
          ARM_CLIENT_ID: $(ARM_CLIENT_ID)
          ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
          ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
          ARM_TENANT_ID: $(ARM_TENANT_ID)

  - script: rm -f $(Pipeline.Workspace)/sf_private_key.pem
    displayName: "Clean up private key"
    condition: always()
