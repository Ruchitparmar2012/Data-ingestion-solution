name: CI - Lint & Validate

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "dbt/**"
      - "terraform/**"
      - ".github/workflows/**"

  workflow_call: {}

permissions:
  contents: read

env:
  DBT_PROFILES_DIR: ${{ github.workspace }}/dbt

jobs:

  ####################################################################
  # Terraform Lint & Validate
  ####################################################################
  terraform-lint:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

  ####################################################################
  # SQLFluff
  ####################################################################
  sql-lint:
    name: SQLFluff lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dbt/requirements.txt

      - name: Install Python Dependencies
        run: pip install -r dbt/requirements.txt

      - name: Install dbt Packages
        working-directory: dbt
        run: dbt deps

      - name: SQLFluff Lint
        run: sqlfluff lint dbt/models --nofail

  ####################################################################
  # dbt Compile
  ####################################################################
  dbt-compile:
    name: dbt parse & compile (dev)

    runs-on: ubuntu-latest

    needs:
      - sql-lint

    environment: dev

    env:
      DBT_TARGET: dev

      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}

      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}

      DBT_LANDING_DB: DEV_HC_LANDING
      DBT_RAW_DB: DEV_HC_RAW
      DBT_FUSION_DB: DEV_HC_FUSION
      DBT_CONSUMPTION_DB: DEV_HC_CONSUMPTION

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dbt/requirements.txt

      - name: Install Python Dependencies
        run: pip install -r dbt/requirements.txt

      - name: Install dbt Packages
        working-directory: dbt
        run: dbt deps

      ##################################################################
      # Create Private Key File From GitHub Secret
      ##################################################################
      - name: Create Snowflake Private Key File
        working-directory: dbt
        shell: bash
        run: |
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > sf_private_key.pem
          chmod 600 sf_private_key.pem
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=$(pwd)/sf_private_key.pem" >> $GITHUB_ENV

      ##################################################################
      # Validate Snowflake Connection
      ##################################################################
      - name: dbt Debug
        working-directory: dbt
        run: dbt debug

      ##################################################################
      # Parse Project
      ##################################################################
      - name: dbt Parse
        working-directory: dbt
        run: dbt parse

      ##################################################################
      # Compile Project
      ##################################################################
      - name: dbt Compile
        working-directory: dbt
        run: dbt compile

      ##################################################################
      # Cleanup
      ##################################################################
      - name: Delete Private Key
        if: always()
        working-directory: dbt
        shell: bash
        run: rm -f sf_private_key.pem