name: CI

# Run on every push and pull request, against whichever branch triggered it
on:
  push:
  pull_request:

env:
  # --- Snowflake connection details (placeholders) ---
  SNOWFLAKE_ACCOUNT: "RZ63409"
  SNOWFLAKE_USER: "TF_CICD_SVC"
  SNOWFLAKE_ROLE: "TF_CICD_ROLE"
  SNOWFLAKE_WAREHOUSE: "COMPUTE_WH"
  SNOWFLAKE_DATABASE: "HC_LANDING"
  SNOWFLAKE_SCHEMA: "PUBLIC"
  # Raw private key content comes from GitHub Secrets - the only secret used.
  # Used directly by dbt (profiles.yml reads it as PEM text).
  SNOWFLAKE_PRIVATE_KEY: ${{ secrets.RSA_KEY  }}
  # Passphrase for the encrypted private key (hardcoded placeholder)
  SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: "MyStrongPassword690!"
  # profiles.yml lives inside dbt/, not the default ~/.dbt/
  DBT_PROFILES_DIR: "dbt"

  # --- Terraform variables (map directly to terraform/variable.tf) ---
  # Terraform only reads input via TF_VAR_<name>; the SNOWFLAKE_* vars above
  # are not automatically visible to Terraform.
  TF_VAR_snowflake_account: "RZ63409"
  TF_VAR_snowflake_user: "TF_CICD_SVC"
  TF_VAR_warehouse: "COMPUTE_WH"
  TF_VAR_role: "TF_CICD_ROLE"
  TF_VAR_database: "HC_LANDING"
  TF_VAR_schema: "PUBLIC"
  TF_VAR_private_key_passphrase: "MyStrongPassword690!"
  # user_private_key expects a FILE PATH, not raw key content - written below
  TF_VAR_user_private_key: ${{ runner.temp }}/snowflake_key.p8

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Write the private key secret to a file for Terraform, which
      #    requires a file path rather than raw key content
      - name: Write Snowflake private key to file
        run: printf '%s' "$SNOWFLAKE_PRIVATE_KEY" > "$TF_VAR_user_private_key"

      # 3. Set up Terraform
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      # 4. Initialize Terraform (runs from terraform/, independent of dbt/)
      - name: Terraform init
        working-directory: terraform
        run: terraform init

      # 5. Run terraform plan
      - name: Terraform plan
        working-directory: terraform
        run: terraform plan

      # 6. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 7. Create and activate a virtual environment, then install dbt deps
      #    from dbt/requirements.txt (runs from dbt/, independent of terraform/)
      - name: Create venv and install dbt dependencies
        working-directory: dbt
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      # 8. Run dbt compile from within dbt/, using the venv created above
      - name: dbt compile
        working-directory: dbt
        run: |
          source .venv/bin/activate
          dbt compile