name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

env:
  ###################################################
  # Snowflake Configuration
  ###################################################
  SNOWFLAKE_ORG: "MVAKLZD"
  SNOWFLAKE_ACCOUNT: "RZ63409"
  SNOWFLAKE_USER: "TF_CICD_SVC"
  SNOWFLAKE_ROLE: "TF_CICD_ROLE"
  SNOWFLAKE_WAREHOUSE: "COMPUTE_WH"
  SNOWFLAKE_DATABASE: "HC_LANDING"
  SNOWFLAKE_SCHEMA: "PUBLIC"

  SNOWFLAKE_PRIVATE_KEY: ${{ secrets.RSA_KEY }}
  SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: "MyStrongPassword690!"

  DBT_PROFILES_DIR: dbt

  ###################################################
  # Terraform Variables
  ###################################################
  TF_VAR_snowflake_org: "MVAKLZD"
  TF_VAR_snowflake_account: "RZ63409"
  TF_VAR_snowflake_user: "TF_CICD_SVC"
  TF_VAR_warehouse: "COMPUTE_WH"
  TF_VAR_role: "TF_CICD_ROLE"
  TF_VAR_database: "HC_LANDING"
  TF_VAR_schema: "PUBLIC"
  TF_VAR_private_key_passphrase: "MyStrongPassword690!"
  TF_VAR_user_private_key: /tmp/snowflake_key.p8

jobs:

  ci:

    runs-on: ubuntu-latest

    steps:

      ###################################################
      # Checkout
      ###################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ###################################################
      # Snowflake Private Key
      ###################################################

      - name: Create Snowflake Private Key
        run: |
          printf '%s' "$SNOWFLAKE_PRIVATE_KEY" > "$TF_VAR_user_private_key"
          chmod 600 "$TF_VAR_user_private_key"

      ###################################################
      # Terraform
      ###################################################

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan

      ###################################################
      # Python
      ###################################################

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: dbt/requirements.txt

      ###################################################
      # Install Python Packages
      ###################################################

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r dbt/requirements.txt

      ###################################################
      # dbt
      ###################################################

      - name: Install dbt Packages
        working-directory: dbt
        run: dbt deps

      - name: dbt Debug
        working-directory: dbt
        run: dbt debug

      - name: dbt Parse
        working-directory: dbt
        run: dbt parse

      - name: dbt Compile
        working-directory: dbt
        run: dbt compile

      ###################################################
      # Cleanup
      ###################################################

      - name: Remove Private Key
        if: always()
        run: rm -f "$TF_VAR_user_private_key"