name: CI - Lint & Validate

# Runs on every pull request. Nothing here ever deploys or touches
# production data — it only lints code and validates that dbt/Terraform
# compile cleanly.
on:
  pull_request:
    branches: [main, develop]
    paths:
      - "dbt/**"
      - "terraform/**"
      - ".github/workflows/**"
  workflow_call: {}   # allows cd.yml to reuse this as a quality gate

permissions:
  contents: read

env:
  DBT_PROFILES_DIR: ${{ github.workspace }}/dbt

jobs:

  # ------------------------------------------------------------------
  # Terraform format + validate (no plan, no state, no credentials)
  # ------------------------------------------------------------------
  terraform-lint:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: terraform fmt -check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: terraform init (no backend, validate only)
        working-directory: terraform
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: terraform
        run: terraform validate

  # ------------------------------------------------------------------
  # SQL / dbt code quality
  # ------------------------------------------------------------------
  sql-lint:
    name: SQLFluff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dbt/requirements.txt

      - name: Install dependencies
        run: pip install -r dbt/requirements.txt

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      - name: SQLFluff lint (models only)
        run: sqlfluff lint dbt/models --nofail

  # ------------------------------------------------------------------
  # dbt parse/compile check against a real (but read-only-role) DEV
  # warehouse. Uses repository secrets scoped to a low-privilege CI role.
  # ------------------------------------------------------------------
  dbt-compile:
    name: dbt parse & compile (dev)
    runs-on: ubuntu-latest
    needs: [sql-lint]
    environment: dev
    env:
      DBT_TARGET: dev
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
      DBT_LANDING_DB: DEV_HC_LANDING
      DBT_RAW_DB: DEV_HC_RAW
      DBT_FUSION_DB: DEV_HC_FUSION
      DBT_CONSUMPTION_DB: DEV_HC_CONSUMPTION
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dbt/requirements.txt

      - name: Install dependencies
        run: pip install -r dbt/requirements.txt

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      - name: dbt debug (connection check)
        working-directory: dbt
        run: dbt debug

      - name: dbt parse
        working-directory: dbt
        run: dbt parse

      - name: dbt compile
        working-directory: dbt
        run: dbt compile
