name: CI - Lint & Validate

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "dbt/**"
      - "terraform/**"
      - ".github/workflows/**"

  pull_request:
    branches:
      - main
      - develop
    paths:
      - "dbt/**"
      - "terraform/**"
      - ".github/workflows/**"

  workflow_call:

permissions:
  contents: read

env:
  DBT_PROFILES_DIR: ${{ github.workspace }}/dbt

jobs:

  ####################################################################
  # Terraform Validation
  ####################################################################
  terraform-lint:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

  ####################################################################
  # SQLFluff Lint
  ####################################################################
  sql-lint:
    name: SQLFluff Lint
    runs-on: ubuntu-latest

    environment: dev

    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
      DBT_TARGET: dev

      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}

      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}

      DBT_LANDING_DB: DEV_HC_LANDING
      DBT_RAW_DB: DEV_HC_RAW
      DBT_FUSION_DB: DEV_HC_FUSION
      DBT_CONSUMPTION_DB: DEV_HC_CONSUMPTION

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dbt/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dbt/requirements.txt

      - name: Create Temporary Snowflake Private Key
        working-directory: dbt
        shell: bash
        run: |
          cat <<'EOF' > sf_private_key.pem
          ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          EOF
          chmod 600 sf_private_key.pem
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=$(pwd)/sf_private_key.pem" >> $GITHUB_ENV

      - name: Verify Private Key
        working-directory: dbt
        run: |
          ls -la
          test -f sf_private_key.pem

      - name: Install dbt Packages
        working-directory: dbt
        run: dbt deps

      - name: Verify Profiles
        working-directory: dbt
        run: |
          ls -la
          test -f profiles.yml

      - name: Verify Environment
        shell: bash
        run: |
          echo "DBT_TARGET=$DBT_TARGET"
          echo "DBT_PROFILES_DIR=$DBT_PROFILES_DIR"
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=$SNOWFLAKE_PRIVATE_KEY_PATH"

      - name: dbt Debug
        working-directory: dbt
        run: dbt debug

      - name: dbt Parse
        working-directory: dbt
        run: dbt parse

      - name: SQLFluff Version
        run: sqlfluff --version

      - name: SQLFluff Lint
        run: sqlfluff lint dbt/models --nofail

      - name: Delete Private Key
        if: always()
        working-directory: dbt
        shell: bash
        run: rm -f sf_private_key.pem

  ####################################################################
  # dbt Parse & Compile
  ####################################################################
  dbt-compile:
    name: dbt Parse & Compile
    runs-on: ubuntu-latest

    needs:
      - terraform-lint
      - sql-lint

    environment: dev

    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
      DBT_TARGET: dev

      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}

      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}

      DBT_LANDING_DB: DEV_HC_LANDING
      DBT_RAW_DB: DEV_HC_RAW
      DBT_FUSION_DB: DEV_HC_FUSION
      DBT_CONSUMPTION_DB: DEV_HC_CONSUMPTION

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dbt/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dbt/requirements.txt

      - name: Install dbt Packages
        working-directory: dbt
        run: dbt deps

      - name: Create Snowflake Private Key File
        working-directory: dbt
        shell: bash
        run: |
          cat <<'EOF' > sf_private_key.pem
          ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          EOF
          chmod 600 sf_private_key.pem
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=$(pwd)/sf_private_key.pem" >> $GITHUB_ENV

      - name: Verify Profiles
        working-directory: dbt
        run: |
          ls -la
          test -f profiles.yml

      - name: dbt Debug
        working-directory: dbt
        run: dbt debug

      - name: dbt Parse
        working-directory: dbt
        run: dbt parse

      - name: dbt Compile
        working-directory: dbt
        run: dbt compile

      - name: Delete Private Key
        if: always()
        working-directory: dbt
        shell: bash
        run: rm -f sf_private_key.pem