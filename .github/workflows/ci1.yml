name: CI

# Run on every push and pull request, against whichever branch triggered it
# on:
#   push:
#   pull_request:

on:
  workflow_dispatch:

env:
  # --- Snowflake connection details (placeholders) ---
  SNOWFLAKE_ACCOUNT: 'RZ63409'
  SNOWFLAKE_USER: 'TF_CICD_SVC'
  SNOWFLAKE_ROLE: 'TF_CICD_ROLE'
  SNOWFLAKE_WAREHOUSE: 'COMPUTE_WH'
  SNOWFLAKE_DATABASE: 'HC_LANDING'
  SNOWFLAKE_SCHEMA: 'PUBLIC'
  # Private key content comes from GitHub Secrets - the only secret used
  SNOWFLAKE_PRIVATE_KEY: ${{ secrets.rsa_key }}
  # Passphrase for the encrypted private key (hardcoded placeholder)
  SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: 'MyStrongPassword690!'
  # profiles.yml lives inside dbt/, not the default ~/.dbt/
  DBT_PROFILES_DIR: "dbt"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Terraform
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      # 3. Initialize Terraform (runs from terraform/, independent of dbt/)
      - name: Terraform init
        working-directory: terraform
        run: terraform init

      # 4. Run terraform plan
      - name: Terraform plan
        working-directory: terraform
        run: terraform plan

      # 5. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 6. Create and activate a virtual environment, then install dbt deps
      #    from dbt/requirements.txt (runs from dbt/, independent of terraform/)
      - name: Create venv and install dbt dependencies
        working-directory: dbt
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      # 7. Run dbt compile from within dbt/, using the venv created above
      - name: dbt compile
        working-directory: dbt
        run: |
          source .venv/bin/activate
          dbt compile
