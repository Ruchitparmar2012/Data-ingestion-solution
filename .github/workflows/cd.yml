name: CD - Deploy Platform

# Auto-deploy rules:
#   push to develop  -> DEV
#   push to main      -> STAGING
# Manual runs cover any environment (including PROD, which requires
# a "DEPLOY" confirmation input AND passes through the `prod` GitHub
# Environment's required reviewers — configure that under
# Settings > Environments > prod > Required reviewers).
on:
  push:
    branches: [develop, main]
    paths:
      - "dbt/**"
      - "terraform/**"
      - ".github/workflows/cd.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: dev
        type: choice
        options: [dev, staging, prod]
      run_terraform:
        description: Apply Terraform changes?
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      confirm_prod:
        description: Type DEPLOY to confirm a PROD run
        required: false
        default: ""

permissions:
  contents: read

jobs:

  # ------------------------------------------------------------------
  # Work out which environment we're deploying and guard PROD
  # ------------------------------------------------------------------
  resolve-environment:
    name: Resolve target environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
            if [ "$ENV" = "prod" ] && [ "${{ github.event.inputs.confirm_prod }}" != "DEPLOY" ]; then
              echo "::error::PROD deploys require confirm_prod = DEPLOY"
              exit 1
            fi
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENV="staging"
          else
            ENV="dev"
          fi
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          echo "Deploying to: $ENV"

  # ------------------------------------------------------------------
  # Reuse the same lint/validate checks as CI as a safety gate
  # ------------------------------------------------------------------
  quality-gate:
    name: Code quality gate
    needs: resolve-environment
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # ------------------------------------------------------------------
  # Terraform apply — provisions/updates Snowflake objects
  # ------------------------------------------------------------------
  terraform:
    name: Terraform apply (${{ needs.resolve-environment.outputs.environment }})
    runs-on: ubuntu-latest
    needs: [resolve-environment, quality-gate]
    if: ${{ github.event.inputs.run_terraform != 'false' }}
    environment: ${{ needs.resolve-environment.outputs.environment }}
    env:
      ENVIRONMENT: ${{ needs.resolve-environment.outputs.environment }}
      TF_VAR_snowflake_org: ${{ secrets.SNOWFLAKE_ORG }}
      TF_VAR_snowflake_account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      TF_VAR_snowflake_user: ${{ secrets.SNOWFLAKE_USER }}
      TF_VAR_private_key_passphrase: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
      TF_VAR_warehouse: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      TF_VAR_role: ${{ secrets.SNOWFLAKE_ROLE }}
      TF_VAR_environment: ${{ needs.resolve-environment.outputs.environment }}
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Write Snowflake private key to a temp file
        working-directory: terraform
        run: |
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > sf_private_key.pem
          chmod 600 sf_private_key.pem
          echo "TF_VAR_user_private_key=$(pwd)/sf_private_key.pem" >> "$GITHUB_ENV"

      - name: terraform init
        working-directory: terraform
        run: terraform init -backend-config="environments/backend-${ENVIRONMENT}.conf"

      - name: terraform plan
        working-directory: terraform
        run: terraform plan -var-file="environments/${ENVIRONMENT}.tfvars" -out=tfplan

      - name: terraform apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Clean up private key
        if: always()
        working-directory: terraform
        run: rm -f sf_private_key.pem

  # ------------------------------------------------------------------
  # dbt build + test + docs
  # ------------------------------------------------------------------
  dbt:
    name: dbt build & test (${{ needs.resolve-environment.outputs.environment }})
    runs-on: ubuntu-latest
    needs: [resolve-environment, terraform]
    if: always() && needs.terraform.result != 'failure'
    environment: ${{ needs.resolve-environment.outputs.environment }}
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
      DBT_TARGET: ${{ needs.resolve-environment.outputs.environment }}
      ENV_UPPER: ${{ needs.resolve-environment.outputs.environment }}

      SNOWFLAKE_ACCOUNT: 'RZ63409'
      SNOWFLAKE_USER: 'TF_CICD_SVC'
      SNOWFLAKE_ROLE: 'TF_CICD_ROLE'
      SNOWFLAKE_WAREHOUSE: 'COMPUTE_WH'
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.rsa_key }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: 'MyStrongPassword690!'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dbt/requirements.txt

      - name: Set environment-specific database names
        run: |
          U=$(echo "${{ needs.resolve-environment.outputs.environment }}" | tr '[:lower:]' '[:upper:]')
          echo "DBT_LANDING_DB=${U}_HC_LANDING" >> "$GITHUB_ENV"
          echo "DBT_RAW_DB=${U}_HC_RAW" >> "$GITHUB_ENV"
          echo "DBT_FUSION_DB=${U}_HC_FUSION" >> "$GITHUB_ENV"
          echo "DBT_CONSUMPTION_DB=${U}_HC_CONSUMPTION" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dbt/requirements.txt

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      - name: Create Temporary Snowflake Private Key
        working-directory: dbt
        shell: bash
        run: |
          cat <<'EOF' > sf_private_key.pem
          ${{ secrets.rsa_key }}
          EOF
          chmod 600 sf_private_key.pem
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=$(pwd)/sf_private_key.pem" >> "$GITHUB_ENV"

      - name: Verify Private Key
        working-directory: dbt
        run: |
          ls -la
          test -f sf_private_key.pem

      - name: Verify Profiles
        working-directory: dbt
        run: |
          ls -la
          test -f profiles.yml

      - name: dbt debug
        working-directory: dbt
        run: dbt debug

      - name: dbt seed
        working-directory: dbt
        run: dbt seed

      - name: dbt run — RAW
        working-directory: dbt
        run: dbt run --select tag:RAW

      - name: dbt run — STG_SILVER
        working-directory: dbt
        run: dbt run --select tag:STG_SILVER

      - name: dbt run — SILVER
        working-directory: dbt
        run: dbt run --select tag:SILVER

      - name: dbt run — STANDARDIZED
        working-directory: dbt
        run: dbt run --select tag:STANDARDIZED

      - name: dbt run — GOLD
        working-directory: dbt
        run: dbt run --select tag:GOLD

      - name: dbt test
        working-directory: dbt
        run: dbt test

      - name: dbt docs generate
        working-directory: dbt
        run: dbt docs generate

      - name: Upload dbt docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs-${{ needs.resolve-environment.outputs.environment }}
          path: dbt/target
          retention-days: 30

      - name: Delete Private Key
        if: always()
        working-directory: dbt
        shell: bash
        run: rm -f sf_private_key.pem